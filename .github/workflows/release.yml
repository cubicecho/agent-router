# Needs no secrets. The images go to GHCR with the built-in token, and the worker package goes to npm by trusted
# publishing: the runner trades its GitHub OIDC token (`id-token: write`) for a short-lived npm credential, which npm
# gives only to a workflow the package trusts:
#
#   npm trust github @cubicecho/agent-router-worker --file release.yml \
#     --repository cubicecho/agent-router --allow-publish
#
# so renaming this file, or moving the publish to another workflow, revokes its access until that is run again. npm
# can only trust a workflow for a package that exists, so the package's first version was published by hand.

name: Release

on:
  # After CI finishes on main, so a commit that fails its checks is never released.
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  # Publishes the images for a version that already exists, without cutting a release.
  workflow_dispatch:
    inputs:
      version:
        description: The version to tag the images with, such as 0.2.0
        required: true

# One release at a time, in order: a second run waits, it does not cancel the first mid-push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # workflow_run fires for failed CI runs too.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
      packages: write
      # npm's trusted publishing, and the provenance attestation the worker package carries.
      id-token: write

    steps:
      - uses: actions/checkout@v7
        with:
          # semantic-release reads the whole history to find the last release and the commits since.
          fetch-depth: 0
          # The commit CI passed, not whatever main has moved to since.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # Trusted publishing needs npm 11.5.1 or later, which Node 26 ships.
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          registry-url: https://registry.npmjs.org
      - name: Install semantic-release
        run: npm install -g semantic-release @semantic-release/commit-analyzer @semantic-release/release-notes-generator @semantic-release/changelog @semantic-release/npm @semantic-release/git @semantic-release/github
      # A dry run first: most pushes release nothing, and the image steps must not run then.
      - name: Release
        id: release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$DISPATCH_VERSION" ]; then
            echo "version=$DISPATCH_VERSION" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          OUTPUT=$(npx semantic-release --dry-run 2>&1)
          echo "$OUTPUT"
          VERSION=$(echo "$OUTPUT" | grep -oP 'next release version is \K[0-9]+\.[0-9]+\.[0-9]+' || echo "")
          if [ -n "$VERSION" ]; then
            npx semantic-release
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "released=true" >> $GITHUB_OUTPUT
          else
            echo "released=false" >> $GITHUB_OUTPUT
          fi
      # The worker package's tarball, attached to the release: `npm i -g <its URL>` installs the worker.
      - name: Pack the worker
        if: steps.release.outputs.released == 'true'
        env:
          WORKER_VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm ci
          npm run pack:worker
      - name: Attach the worker package to the release
        if: steps.release.outputs.released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
        run: gh release upload "v$VERSION" cubicecho-agent-router-worker-"$VERSION".tgz --clobber
      # The same tarball, on npm. A version already there is skipped, so publishing the images again by hand for an
      # old version leaves npm alone. No NPM_TOKEN on purpose: one would be used whenever the OIDC exchange quietly
      # failed, hiding a broken trust setup.
      - name: Publish the worker package to npm
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if npm view "@cubicecho/agent-router-worker@$VERSION" version > /dev/null 2>&1; then
            echo "@cubicecho/agent-router-worker@$VERSION is on npm already."
            exit 0
          fi
          npm publish ./cubicecho-agent-router-worker-"$VERSION".tgz --provenance --access public
      # The worker image is also built for arm64, for workers on a Pi; the router's stays amd64.
      - uses: docker/setup-qemu-action@v4
        if: steps.release.outputs.released == 'true'
        with:
          platforms: arm64
      - name: Set up Docker Buildx
        if: steps.release.outputs.released == 'true'
        uses: docker/setup-buildx-action@v4
      - name: Log in to GHCR
        if: steps.release.outputs.released == 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Built from this checkout, where semantic-release has just written the version into package.json, which is
      # what /healthz reports.
      - name: Build and push
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
      - name: Build and push the worker
        if: steps.release.outputs.released == 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          target: worker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-worker:${{ steps.release.outputs.version }}
            ghcr.io/${{ github.repository }}-worker:latest
